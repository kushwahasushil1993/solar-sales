spring.datasource.url=jdbc:h2:mem:solar-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
app.seed-demo-data=false
spring.jpa.open-in-view=false
# Placeholder OAuth clients so the login wiring is exercised; tests never contact Google or GitHub.
app.oauth.google.client-id=test-google-client
app.oauth.google.client-secret=test-google-secret
app.oauth.github.client-id=test-github-client
app.oauth.github.client-secret=test-github-secret
# Send notification emails synchronously so tests can assert on them
app.notifications.async=false
app.company.name=Test Solar Co
