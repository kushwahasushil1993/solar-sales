spring.application.name=solar-sales
server.port=${PORT:8081}

# Local file-based H2 database (data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/solar-sales;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Excel upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Insert demo records on first start when the table is empty
app.seed-demo-data=true

# ---------------------------------------------------------------- sign-in (email + password, OAuth2)
# No secrets are committed. Provide them via environment variables or a git-ignored
# local.properties file (copy local.properties.example), which is imported here.
spring.config.import=optional:file:./local.properties,optional:file:./backend/local.properties

# Google / GitHub sign-in: a provider is enabled when both its client id and secret are set (see README).
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}

# Users, roles and passwords live only in the database. On a new install the app asks to create the first
# administrator; after that admins manage users (roles, passwords) on the Users page.

# "Forgot password" links: lifetime, and the app's public address used in the link (defaults to the address
# the request came through, e.g. http://localhost:5173 via the Vite proxy). Set it in production, e.g. https://solar.example.com
app.password-reset.ttl-minutes=30
app.public-url=${PUBLIC_URL:}

server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# Build OAuth redirect URLs from the proxy's Host / X-Forwarded-* headers (Vite in dev, Nginx in production)
server.forward-headers-strategy=framework

# ---------------------------------------------------------------- mobile number sign-in (SMS one-time code)
# Twilio (https://console.twilio.com): account SID, auth token and a sender number / Messaging Service SID (MG...).
# Without them, codes are written to the backend log (fine for development only).
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}
# Twilio Verify Service SID (VA...): Twilio generates, texts (its predefined OTP message) and checks the codes.
# Required on Twilio trial accounts, which can't send custom SMS text. Leave empty to send our own message.
app.sms.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
# Twilio TRIAL alternative: name of a predefined template to send (sms_2fa). Twilio picks the code and the app
# reads it from Twilio's reply. Remove after upgrading the Twilio account to send our own text (app.otp.message).
app.sms.twilio.trial-template=${TWILIO_TRIAL_TEMPLATE:}
# INSECURE, local testing only: Twilio's trial template always sends the same sample code; true accepts it anyway.
app.sms.twilio.trial-allow-fixed-code=false
# Country code added to numbers typed without one (91 = India)
app.sms.default-country-code=${SMS_DEFAULT_COUNTRY_CODE:91}
app.otp.ttl-seconds=300
# Text of our own OTP SMS ({code} required; {minutes}, {company} optional). Not used in Twilio Verify mode.
app.otp.message=Your verification code is {code}. It expires in {minutes} minutes. Do not share it.
app.otp.resend-cooldown-seconds=30
app.otp.max-per-hour=5
app.otp.max-attempts=5
# Safety cap on SMS cost across all numbers
app.otp.max-global-per-hour=200

# ---------------------------------------------------------------- customer emails (invoice + workflow)
# SMTP server, e.g. Gmail: MAIL_HOST=smtp.gmail.com MAIL_USERNAME=you@gmail.com MAIL_PASSWORD=<app password>.
# Without MAIL_HOST, emails are only written to the log (and recorded as "skipped").
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.starttls=${MAIL_STARTTLS:true}
app.notifications.async=true

# Seller details shown on invoices and emails
app.company.name=${COMPANY_NAME:SolarSales}
app.company.email=${COMPANY_EMAIL:}
app.company.phone=${COMPANY_PHONE:}
app.company.address=${COMPANY_ADDRESS:}
app.company.gstin=${COMPANY_GSTIN:}
app.company.website=${COMPANY_WEBSITE:}

# Thymeleaf is only used for email templates
spring.thymeleaf.check-template-location=false

# ---------------------------------------------------------------- API docs
# Swagger UI: http://localhost:8081/swagger-ui.html (or /swagger-ui.html through the frontend)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.packages-to-scan=com.solar.sales.controller
