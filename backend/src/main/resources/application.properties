spring.application.name=solar-sales
server.port=${PORT:8081}

# Local file-based H2 database (data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/solar-sales;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Excel upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Allowed origin for the React dev server
app.cors.allowed-origins=http://localhost:5173
# Insert demo records on first start when the table is empty
app.seed-demo-data=true

# ---------------------------------------------------------------- secrets
# No secrets are committed. Provide them via environment variables or a git-ignored
# local.properties file (copy local.properties.example), which is imported here.
spring.config.import=optional:file:./local.properties,optional:file:./backend/local.properties

# JWT signing key (Base64, >= 32 bytes): JWT_SECRET=$(openssl rand -base64 48)
# If unset, a random key is generated at startup (everyone is signed out on restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=8

# Admin account created on startup if no user with this email exists.
# If ADMIN_PASSWORD is unset, a random password is generated and printed once in the startup log.
app.admin.email=${ADMIN_EMAIL:admin@solarsales.local}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}
